name: Release to PyPI

run-name: Publish ${{ inputs.tag || github.event.release.tag_name }} to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact release tag to build and publish"
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-pypi
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/ci.yml
    with:
      checkout_ref: ${{ inputs.tag || github.event.release.tag_name }}

  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verify release tag matches package version
        run: |
          python - <<'PYCODE'
          import os, re, subprocess
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          version = re.search(r'^__version__ = "([^"]+)"$', Path("src/ablation_workbench/__init__.py").read_text(), re.M).group(1)
          if tag != "v" + version or tag not in subprocess.check_output(["git", "tag", "--points-at", "HEAD"], text=True).splitlines():
              raise SystemExit("Release tag must match the checked-out package version")
          PYCODE

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Build bundled UI
        run: npm ci && npm run build:ui

      - name: Build distributions
        run: pipx run build

      - name: Check distribution metadata
        run: pipx run twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
