name: CI
on:
  workflow_call:
    inputs:
      checkout_ref:
        required: true
        type: string
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browser_smoke:
        description: Run the offline browser integration smoke test
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
          ABLATION_UPDATE_CHECK: '0'
      - run: python -m build
      - name: Install wheel without source imports
        run: |
          python -m venv wheel-check
          wheel-check/bin/python -m pip install dist/*.whl
          cd wheel-check
          bin/ablation --help
          bin/python -c "from importlib.resources import files; p=files('ablation_workbench'); assert p.joinpath('CHANGELOG.md').is_file(); assert p.joinpath('skills/ablation/SKILL.md').is_file(); assert any(x.name.endswith('.html') for x in p.rglob('*'))"
        env:
          ABLATION_UPDATE_CHECK: '0'
  browser-smoke:
    if: inputs.browser_smoke == true || vars.ABLATION_BROWSER_SMOKE == 'enabled'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check:ui
      - run: npm run test:ui
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser_smoke.cjs
        env:
          PYTHONPATH: src
          ABLATION_UPDATE_CHECK: '0'
